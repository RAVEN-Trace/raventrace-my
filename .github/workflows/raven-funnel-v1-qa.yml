name: Raven Reader Funnel V1.2.0 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raven-funnel-v1-qa.yml'
      - 'assets/css/raven-funnel-v1.css'
      - 'assets/js/raven-funnel-v1.js'
      - 'scripts/apply_raven_funnel_v1.py'
      - 'index.html'
      - 'investigations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-funnel-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate source syntax
        run: |
          node --check assets/js/raven-funnel-v1.js
          python -m py_compile scripts/apply_raven_funnel_v1.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production funnel V1.2.0
        run: |
          node - <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const base='https://raven-trace.github.io/raventrace-my'; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const browser=await chromium.launch(); const errors=[]; const check=(c,m)=>{if(!c)errors.push(m)};
            async function openCurrent(page,path){for(let i=0;i<30;i++){await page.goto(`${base}${path}?funnelqa=${Date.now()}-${Math.random()}`,{waitUntil:'domcontentloaded',timeout:45000}); const ready=await page.evaluate(()=>!!document.querySelector('link[href*="raven-funnel-v1.css?v=1.2.0"]')&&!!document.querySelector('script[src*="raven-funnel-v1.js?v=1.2.0"]')); if(ready)return; await sleep(3000)} throw new Error(`V1.2.0 not deployed: ${path}`)}
            for(const viewport of [{width:390,height:844},{width:1440,height:900}]){const ctx=await browser.newContext({viewport}); const page=await ctx.newPage(); await openCurrent(page,'/investigations/rci-tabung-haji/narratives/'); await page.waitForSelector('.raven-evidence-bridge',{timeout:15000}); const m=await page.evaluate(()=>({cards:document.querySelectorAll('.narrative-v5-card[id^="naratif-"]').length,bridges:document.querySelectorAll('.raven-evidence-bridge').length,sources:document.querySelectorAll('#sources .sources-grid > li[id^="source-"]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,api:!!window.ravenReadMetrics})); check(m.cards>=8,`cards ${m.cards}`); check(m.cards===m.bridges,`bridges ${m.bridges}/${m.cards}`); check(m.sources>=5,`sources ${m.sources}`); check(m.overflow<=4,`overflow ${m.overflow}`); check(m.api,'metrics API missing'); await ctx.close()}
            await browser.close(); console.log(JSON.stringify({errors},null,2)); if(errors.length)throw new Error(errors.join('\n'));
          })();
          JS
      - name: Upload Funnel QA marker
        if: always()
        run: |
          mkdir -p funnel-qa
          printf '{"version":"1.2.0","status":"workflow completed"}\n' > funnel-qa/report.json
      - name: Upload Funnel QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raven-reader-funnel-v1-qa
          path: funnel-qa/
          retention-days: 14

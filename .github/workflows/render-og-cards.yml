name: Render OG news cards

on:
  push:
    paths:
      - 'scripts/render_og_cards.py'
      - '.github/workflows/render-og-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render 1200x630 cards
        run: python scripts/render_og_cards.py

      - name: Verify generated assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          out = Path('assets/og')
          files = sorted(out.glob('*.jpg'))
          assert len(files) == 5, f'expected 5 cards, got {len(files)}'
          for p in files:
              im = Image.open(p)
              assert im.size == (1200, 630), (p, im.size)
              assert p.stat().st_size < 300_000, (p, p.stat().st_size)
              print(p, im.size, p.stat().st_size)
          PY

      - name: Commit generated cards
        run: |
          git config user.name "RAVEN-Trace Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/og/*.jpg
          if git diff --cached --quiet; then
            echo "No OG changes"
            exit 0
          fi
          git commit -m "Render Phase 2B social news cards"
          git push

# Live production gate for legal-state + freshness-state separation
name: Production Integrity Live Render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-integrity-live-render.yml'
      - 'index.html'
      - 'investigations/**'
      - 'news/**'
      - 'assets/js/**'
      - 'assets/css/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://raven-trace.github.io/raventrace-my
    steps:
      - name: Wait for complete 12 Sep Pages payload
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['BASE']
          headers={'User-Agent':'RAVEN-Trace-Live-QA/1.1','Cache-Control':'no-cache'}
          checks={
            '/':['freshness sweep: 12 Sep 20:44 MYT','empat individu telah berdepan pertuduhan','SPRM pula menyebut lima'],
            '/news/':['freshness sweep 12 Sep 2026','PAC TH bersidang 15 September'],
            '/investigations/rci-tabung-haji/updates/':['JEJAK / 12-01','15 Sep','RM18.6 juta'],
            '/investigations/rci-tabung-haji/sources/':['id="s65"','id="s66"','parlimen.gov.my/pac/senarai-mesyuarat'],
          }
          last={}
          for i in range(48):
              ok=True
              for path,tokens in checks.items():
                  try:
                      req=urllib.request.Request(base+path+'?liveqa='+str(time.time_ns()),headers=headers)
                      text=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                      last[path]=text
                      if not all(x in text for x in tokens): ok=False
                  except Exception as e:
                      ok=False
                      print('wait',i,path,type(e).__name__,str(e)[:160])
              if ok:
                  print('COMPLETE 12 SEP LIVE PAYLOAD READY')
                  raise SystemExit(0)
              time.sleep(5)
          for path,text in last.items(): print(path,text[:500])
          raise SystemExit('Timed out waiting for complete 12 Sep Pages payload')
          PY

      - name: Verify homepage legal and freshness boundary
        run: |
          python - <<'PY'
          import os,urllib.request,time
          req=urllib.request.Request(os.environ['BASE']+'/?qa='+str(time.time_ns()),headers={'User-Agent':'RAVEN-Trace-Live-QA/1.1','Cache-Control':'no-cache'})
          t=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          required=[
            'Status mahkamah: 11 Sep · freshness sweep: 12 Sep 20:44 MYT',
            'empat individu telah berdepan pertuduhan',
            'SPRM pula menyebut lima',
            'DIPERTIKAIKAN · REKOD',
            'PAC TH dijadual bersidang 15 Sep',
            'raven-publication.js?v=5.0.0',
            'raven-evidence-ux.js?v=3.0.0',
            'Siasatan, tangkapan, reman dan pertuduhan tidak membuktikan kesalahan.',
          ]
          forbidden=[
            'Setakat 9 September, tiga individu telah didakwa',
            '9 September 2026 · verified 18:29 MYT',
            'raven-publication.js?v=4.3.0',
            'raven-evidence-ux.js?v=2.1.0',
            '5 individu telah didakwa',
          ]
          for x in required: assert x in t, 'missing homepage token: '+x
          for x in forbidden: assert x not in t, 'stale homepage token: '+x
          print('HOMEPAGE LEGAL/FRESHNESS BOUNDARY: PASS')
          PY

      - name: Verify 12 Sep article and core investigation pages
        run: |
          python - <<'PY'
          import os,urllib.request,time
          base=os.environ['BASE']
          checks={
            '/news/':['12 SEP 2026','PAC TH bersidang 15 September'],
            '/news/2026/09/12/freshness-sweep-pac-15-sep-rm18m-claim/':['Status undang-undang belum berubah','BELUM DISELESAIKAN / HOLD','15 September 2026','14 Sep','24 Sep'],
            '/investigations/rci-tabung-haji/':['JEJAK / 12-01','PAC TH dijadual 15 September','SPRM menyebut lima'],
            '/investigations/rci-tabung-haji/people/':['Didakwa · belum sabit','Tindakan mahkamah dijadual · 14 Sep'],
            '/investigations/rci-tabung-haji/timeline/':['15 Sep</time><h3>PAC Parlimen','14 Sep','empat','lima'],
            '/investigations/rci-tabung-haji/tracks/':['AMLA','BELUM DIKETAHUI'],
            '/investigations/rci-tabung-haji/governance/':['Seruan Istito’ah','RM15,000','Tabung Haji · kenyataan rasmi · 11 Sep'],
            '/investigations/rci-tabung-haji/narratives/':['SPRM','lima','Pertuduhan bukan sabitan'],
            '/investigations/rci-tabung-haji/sources/':['2605735','2605582','pr11092026_BM','id="s65"','id="s66"'],
            '/investigations/rci-tabung-haji/updates/':['JEJAK / 12-01','15 Sep:','RM18.6 juta','AMLA'],
          }
          for path,tokens in checks.items():
              req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers={'User-Agent':'RAVEN-Trace-Live-QA/1.1','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200,(path,r.status)
                  text=r.read().decode('utf-8','replace')
              for x in tokens: assert x in text, f'{path}: missing {x}'
              print(path,'PASS')
          PY

      - name: Verify factual runtime assets remain inert
        run: |
          python - <<'PY'
          import os,urllib.request,time
          base=os.environ['BASE']
          assets=[
            '/assets/js/raven-evidence-ux.js?v=3.0.0',
            '/assets/js/raven-publication-core.js?v=3.0.0',
            '/assets/js/raven-narrative.js?v=2.0.0',
          ]
          forbidden=['Jamil Khir','Abdul Azeez','Azmi Ahmad','9 September 2026','18:29 MYT','ravenCaseState','.section-cutoff']
          for path in assets:
              req=urllib.request.Request(base+path+'&qa='+str(time.time_ns()),headers={'User-Agent':'RAVEN-Trace-Live-QA/1.1','Cache-Control':'no-cache'})
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in forbidden: assert x not in text, f'{path}: factual mutator token present: {x}'
              print(path,'INERT PASS')
          PY

      - name: Verify production boundary and source hygiene
        run: |
          python - <<'PY'
          import os,urllib.request,time
          base=os.environ['BASE']
          paths=['/','/news/','/investigations/rci-tabung-haji/','/investigations/rci-tabung-haji/updates/','/investigations/rci-tabung-haji/sources/']
          forbidden=['rci-tabung-haji-share-v5.jpg','11 dan 17 September','5 individu telah didakwa','Maklumat disemak hingga:</strong> 10 September 2026 · lewat malam MYT']
          for path in paths:
              req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers={'User-Agent':'RAVEN-Trace-Live-QA/1.1','Cache-Control':'no-cache'})
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in forbidden: assert x not in text, f'{path}: forbidden production token: {x}'
          print('PRODUCTION BOUNDARY: PASS')
          PY

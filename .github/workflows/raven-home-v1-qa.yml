name: Raven Homepage Truth Navigator V1 QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/raven-home-v1.css'
      - '.github/workflows/raven-home-v1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-home-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static homepage contract
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'data-raven-home="1.0.0"',
            'raven-home-v1.css?v=1.0.0',
            'Cerita boleh dibentuk. Bukti tak boleh dipaksa.',
            'class="front-hero home-active-case"',
            '14 pelaburan disyor diperiksa RCI',
            'class="home-update-lead"',
            'data-variant="home"',
            'class="home-trust-strip"'
          ]
          for item in required: assert item in t, item
          assert t.count('class="v5-truth-intro signal-home-hero"') == 1
          assert t.count('class="home-update-row"') == 2
          assert 'Gred A/B' not in t
          assert 'class="section newsroom-board"' not in t
          assert 'class="container public-tools"' not in t
          assert 'Raven terakhir semak halaman ini: 12 Sep' in t
          assert 'Status mahkamah disahkan hingga: 11 Sep 2026' in t
          assert 'mengaku tidak bersalah' in t
          assert 'Ditahan ≠ direman ≠ didakwa ≠ bersalah' in t
          print('Static homepage contract PASS')
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify rendered production homepage
        run: |
          mkdir -p home-qa
          node - <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const base='https://raven-trace.github.io/raventrace-my/';
            const browser=await chromium.launch();
            const errors=[]; const report={};
            const check=(c,m)=>{ if(!c) errors.push(m); };
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));

            async function waitForDeploy(page){
              for(let i=0;i<40;i++){
                await page.goto(`${base}?homeqa=${Date.now()}-${Math.random()}`,{waitUntil:'domcontentloaded',timeout:45000});
                const ready=await page.evaluate(()=>
                  document.body?.dataset?.ravenHome==='1.0.0' &&
                  !!document.querySelector('link[href*="raven-home-v1.css?v=1.0.0"]')
                );
                if(ready) return;
                await sleep(3000);
              }
              throw new Error('Homepage V1 production marker not deployed');
            }

            for(const viewport of [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:900}]){
              const ctx=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
              const page=await ctx.newPage();
              await waitForDeploy(page);
              await page.waitForTimeout(1400);

              const data=await page.evaluate((vp)=>{
                const visible=(el)=>!!el && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden' && el.getBoundingClientRect().height>0;
                const ids=[...document.querySelectorAll('[id]')].map(el=>el.id);
                const dups=ids.filter((id,i)=>ids.indexOf(id)!==i);
                const mainText=document.querySelector('main')?.innerText || '';
                const controls=[...document.querySelectorAll('main a, main button, main summary')].filter(visible);
                const smallControls=controls.filter(el=>{
                  const r=el.getBoundingClientRect();
                  return r.width<40 || r.height<40;
                }).map(el=>({text:(el.textContent||'').trim().slice(0,70),w:Math.round(el.getBoundingClientRect().width),h:Math.round(el.getBoundingClientRect().height)}));
                return {
                  viewport:vp,
                  height:document.documentElement.scrollHeight,
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  truthHeroes:document.querySelectorAll('.v5-truth-intro').length,
                  activeCases:document.querySelectorAll('.home-active-case').length,
                  signalStrips:document.querySelectorAll('.signal-strip').length,
                  leadUpdates:document.querySelectorAll('.home-update-lead').length,
                  updateRows:document.querySelectorAll('.home-update-row').length,
                  updateCards:document.querySelectorAll('#latest .update-card').length,
                  contextBridges:document.querySelectorAll('.raven-context-bridge[data-variant="home"]').length,
                  contextLinks:document.querySelectorAll('.raven-context-bridge[data-variant="home"] .raven-context-links > a').length,
                  trustStrips:document.querySelectorAll('.home-trust-strip').length,
                  visibleSharebars:[...document.querySelectorAll('main .raven-sharebar')].filter(visible).length,
                  newsroomBoards:document.querySelectorAll('.newsroom-board').length,
                  publicTools:document.querySelectorAll('.public-tools').length,
                  duplicateIds:[...new Set(dups)],
                  smallControls,
                  hasGradeAB:/Gred A\/B/.test(mainText),
                  hasFreshness:/Raven terakhir semak halaman ini: 12 Sep/.test(document.body.innerText),
                  hasCourtFreshness:/Status mahkamah disahkan hingga: 11 Sep 2026/.test(mainText),
                  hasLegalBoundary:/Ditahan ≠ direman ≠ didakwa ≠ bersalah/.test(mainText),
                  azeezBoundary:/Abdul Azeez didakwa pada 9 September dan mengaku tidak bersalah\./.test(mainText),
                  heroTitle:document.querySelector('.v5-truth-intro h1')?.textContent?.trim(),
                  ogTitle:document.querySelector('meta[property="og:title"]')?.content || '',
                  cssHome:!!document.querySelector('link[href*="raven-home-v1.css?v=1.0.0"]')
                };
              },viewport.name);

              check(data.truthHeroes===1,`${viewport.name}: truth heroes ${data.truthHeroes}`);
              check(data.activeCases===1,`${viewport.name}: active case blocks ${data.activeCases}`);
              check(data.signalStrips===1,`${viewport.name}: signal strips ${data.signalStrips}`);
              check(data.leadUpdates===1,`${viewport.name}: lead updates ${data.leadUpdates}`);
              check(data.updateRows===2,`${viewport.name}: compact update rows ${data.updateRows}`);
              check(data.updateCards===0,`${viewport.name}: legacy update cards still present ${data.updateCards}`);
              check(data.contextBridges===1,`${viewport.name}: home context bridges ${data.contextBridges}`);
              check(data.contextLinks===4,`${viewport.name}: deeper links ${data.contextLinks}`);
              check(data.trustStrips===1,`${viewport.name}: trust strips ${data.trustStrips}`);
              check(data.visibleSharebars===0,`${viewport.name}: visible homepage sharebars ${data.visibleSharebars}`);
              check(data.newsroomBoards===0,`${viewport.name}: duplicate newsroom board remains`);
              check(data.publicTools===0,`${viewport.name}: old public-tools block remains`);
              check(data.duplicateIds.length===0,`${viewport.name}: duplicate IDs ${data.duplicateIds.join(', ')}`);
              check(data.overflow<=4,`${viewport.name}: horizontal overflow ${data.overflow}px`);
              check(!data.hasGradeAB,`${viewport.name}: Gred A/B leaked into homepage`);
              check(data.hasFreshness,`${viewport.name}: page freshness missing`);
              check(data.hasCourtFreshness,`${viewport.name}: court freshness missing`);
              check(data.hasLegalBoundary,`${viewport.name}: legal boundary missing`);
              check(data.azeezBoundary,`${viewport.name}: Azeez not-guilty plea boundary missing`);
              check(data.heroTitle==='Cerita boleh dibentuk. Bukti tak boleh dipaksa.',`${viewport.name}: hero title drift`);
              check(data.ogTitle.includes('Cerita boleh dibentuk. Bukti tak boleh dipaksa.'),`${viewport.name}: generic homepage OG title missing`);
              check(data.cssHome,`${viewport.name}: homepage CSS missing`);
              if(viewport.width<=430){
                check(data.height<=6500,`mobile: page still too tall ${data.height}px`);
                const bad=data.smallControls.filter(x=>x.text && !/Semak →|Sumber rasmi RCI|Status pendakwaan/.test(x.text));
                check(bad.length<=2,`mobile: too many undersized controls ${JSON.stringify(bad.slice(0,8))}`);
              }

              await page.screenshot({path:`home-qa/${viewport.name}-home.png`,fullPage:true});
              report[viewport.name]=data;
              await ctx.close();
            }

            fs.writeFileSync('home-qa/report.json',JSON.stringify({report,errors},null,2));
            console.log(JSON.stringify({report,errors},null,2));
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
          })();
          JS
      - name: Upload homepage QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raven-home-truth-navigator-v1-qa
          path: home-qa/
          retention-days: 14

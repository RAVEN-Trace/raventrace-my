name: Raven Public Language V2.3 Copy-Lock Gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_public_language_v2_1.py'
      - 'scripts/apply_public_language_v2_2.py'
      - 'scripts/apply_public_language_v2_3.py'
      - 'assets/js/raven-narrative-v5.js'
      - 'investigations/rci-tabung-haji/narratives/**'
      - '.github/workflows/apply-public-language-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Narrative transformer syntax
        run: node --check assets/js/raven-narrative-v5.js

      - name: Verify Narrative copy lock and current schema
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('investigations/rci-tabung-haji/narratives/index.html').read_text(encoding='utf-8')
          social = Path('investigations/rci-tabung-haji/narratives/political-social-media/index.html').read_text(encoding='utf-8')

          assert 'data-raven-copy-lock="true"' in main
          assert 'data-raven-copy-lock="true"' in social
          assert main.count('raven-narrative-v5.css?v=5.3.0') == 1
          assert main.count('raven-narrative-v5.js?v=5.3.0') == 1
          assert 'raven-narrative-v3-1.css' not in main
          assert 'raven-narrative-v3-1.css' not in social

          for token in [
              'Cerita boleh betul separuh — dan tetap buat kita salah faham.',
              'Enam cerita utama — dibedah satu-satu.',
              'RM13 bilion dicuri / hilang',
              '6 actual arraignments',
              'application ≠ final forfeiture order',
              'DISPUTED / UNKNOWN',
              'Active paper ≠ proven offence',
              'Naratif yang kuat tidak semestinya benar.'
          ]:
              assert token in main, token

          for token in [
              'Buang parti, buang slogan, buang emosi',
              'Government position · 16 Sep',
              'UMNO position',
              '19 Sep enforcement disclosure',
              'Siapa bawa cerita apa?',
              'VIRAL TAK BERMAKSUD SUARA SEMUA ORANG'
          ]:
              assert token in social, token

          nv5 = main.find('raven-narrative-v5.js?v=5.3.0')
          funnel = main.find('raven-funnel-v1.js?v=1.2.1')
          signal = main.find('raven-signal-v6.js?v=6.0.0')
          assert 0 <= nv5 < funnel < signal

          print('PUBLIC LANGUAGE COPY-LOCK GATE: PASS')
          PY

      - name: Verify legacy mutators respect copy lock
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              'scripts/apply_public_language_v2_1.py',
              'scripts/apply_public_language_v2_2.py',
              'scripts/apply_public_language_v2_3.py'
          ]:
              text = Path(path).read_text(encoding='utf-8')
              assert 'data-raven-copy-lock="true"' in text, path
              assert 'copy-lock skip' in text, path
          print('LEGACY PUBLIC LANGUAGE MUTATORS: COPY-LOCKED')
          PY

      - name: Repository diff check
        run: git diff --check

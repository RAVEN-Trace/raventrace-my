name: Patch RCI CASEFILE OG preview

on:
  push:
    paths:
      - '.github/workflows/patch-rci-casefile-og.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Open Graph metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('investigations/rci-tabung-haji/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <link rel="canonical" href="https://raven-trace.github.io/raventrace-my/investigations/rci-tabung-haji/">\n'
          og = '''  <meta property="og:type" content="article">\n  <meta property="og:site_name" content="RAVEN-Trace Malaysia">\n  <meta property="og:title" content="RCI Tabung Haji — Perkembangan & CASEFILE RAVEN-Trace">\n  <meta property="og:description" content="Perkembangan terkini, individu, timeline, jejak wang dan sumber untuk siasatan RCI Tabung Haji — dipisahkan antara fakta, dakwaan dan perkara yang masih belum terbukti.">\n  <meta property="og:url" content="https://raven-trace.github.io/raventrace-my/investigations/rci-tabung-haji/">\n  <meta property="og:image" content="https://raven-trace.github.io/raventrace-my/assets/og/rci-tabung-haji-updates.png?v=20260909">\n  <meta property="og:image:width" content="1536">\n  <meta property="og:image:height" content="1024">\n  <meta property="og:image:alt" content="Ilustrasi editorial RAVEN-Trace untuk perkembangan RCI Tabung Haji">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="RCI Tabung Haji — Perkembangan & CASEFILE RAVEN-Trace">\n  <meta name="twitter:description" content="Perkembangan terkini dan bukti yang boleh diaudit untuk RCI Tabung Haji.">\n  <meta name="twitter:image" content="https://raven-trace.github.io/raventrace-my/assets/og/rci-tabung-haji-updates.png?v=20260909">\n'''
          if 'property="og:image"' not in s:
              if marker not in s:
                  raise SystemExit('canonical marker not found')
              s = s.replace(marker, marker + og, 1)
          else:
              import re
              s = re.sub(r'<meta property="og:image" content="[^"]+">', '<meta property="og:image" content="https://raven-trace.github.io/raventrace-my/assets/og/rci-tabung-haji-updates.png?v=20260909">', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investigations/rci-tabung-haji/index.html
          git commit -m 'Add social preview metadata to RCI CASEFILE'
          git push

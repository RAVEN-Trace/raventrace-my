name: Prepare RCI share repair
on:
  push:
    branches: [fix/social-preview-integrity]
    paths: [.github/workflows/prepare-rci-share-repair.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow lxml
      - run: python scripts/build_rci_share_pages.py
      - run: python scripts/check_rci_share_pages.py
      - run: node scripts/check_raven_share.cjs
      - name: Commit validated generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/rci-tabung-haji-share-v4.jpg investigations/rci-tabung-haji
          if ! git diff --cached --quiet; then
            git commit -m "Build validated RCI share artwork and static section pages"
            git push origin HEAD:fix/social-preview-integrity
          fi

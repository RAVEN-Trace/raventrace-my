name: Narrative Forensics Live Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/narrative-forensics-live-gate.yml'
      - 'investigations/rci-tabung-haji/narratives/**'
      - 'assets/css/raven-narrative-v5.css'
      - 'assets/js/raven-narrative-v5.js'
      - 'scripts/raven-reader-v8-qa.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: https://raven-trace.github.io/raventrace-my
    steps:
      - name: Wait for Narrative Forensics 19 Sep deployment
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['BASE']
          paths={
            '/investigations/rci-tabung-haji/narratives/':['Cerita boleh betul separuh','Enam cerita utama','6 actual arraignments','Naratif yang kuat tidak semestinya benar.','raven-narrative-v5.css?v=5.3.1','raven-narrative-v5.js?v=5.3.0','data-raven-copy-lock="true"'],
            '/investigations/rci-tabung-haji/narratives/political-social-media/':['Buang parti, buang slogan, buang emosi','Government position · 16 Sep','UMNO position','19 Sep enforcement disclosure','raven-narrative-v5.css?v=5.3.1','data-raven-narrative-deep="true"','data-raven-copy-lock="true"']
          }
          headers={'User-Agent':'RAVEN-Trace-Narrative-QA/19Sep','Cache-Control':'no-cache'}
          for attempt in range(60):
              ok=True
              for path,tokens in paths.items():
                  try:
                      req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers=headers)
                      text=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                      if not all(tok in text for tok in tokens): ok=False
                  except Exception:
                      ok=False
              if ok:
                  print('NARRATIVE FORENSICS 19 SEP LIVE PAYLOAD READY')
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('Timed out waiting for Narrative Forensics 19 Sep')
          PY

      - name: Verify public language and evidence boundaries
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['BASE']
          headers={'User-Agent':'RAVEN-Trace-Narrative-QA/19Sep','Cache-Control':'no-cache'}
          def get(path):
              req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers=headers)
              return urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          main=get('/investigations/rci-tabung-haji/narratives/')
          social=get('/investigations/rci-tabung-haji/narratives/political-social-media/')
          main_required=['RM13 bilion dicuri / hilang','6 actual arraignments','application ≠ final forfeiture order','DISPUTED / UNKNOWN','Active paper ≠ proven offence','Naratif yang kuat tidak semestinya benar.']
          social_required=['Buang parti, buang slogan, buang emosi','Government position · 16 Sep','UMNO position','19 Sep enforcement disclosure','KITA NAMPAK TINDAKAN. NIAT? BELUM TENTU','VIRAL TAK BERMAKSUD SUARA SEMUA ORANG']
          for x in main_required: assert x in main, 'main missing '+x
          for x in social_required: assert x in social, 'social missing '+x
          forbidden=['Category collapse + number laundering','ANALISIS / INFERENCE · MOTIF TIDAK DIBUKTIKAN','policy position, bukan finding undang-undang','comparative selective-enforcement analysis','counter-narrative','accounting treatment','selective targeting','signal yang diperhatikan','pemberat engagement','Prinsip komunikasi']
          for x in forbidden:
              assert x not in main, 'main stale jargon '+x
              assert x not in social, 'social stale jargon '+x
          print('NARRATIVE FORENSICS 19 SEP LANGUAGE/EVIDENCE: PASS')
          PY

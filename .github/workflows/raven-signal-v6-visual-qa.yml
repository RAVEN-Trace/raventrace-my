name: Raven Signal V6 Visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raven-signal-v6-visual-qa.yml'
      - 'assets/css/raven-signal-v6.css'
      - 'assets/js/raven-signal-v6.js'
      - 'index.html'
      - 'investigations/**'
      - 'news/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run rendered mobile and desktop checks
        run: |
          mkdir -p visual-qa
          cat > /tmp/raven-visual-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://raven-trace.github.io/raventrace-my';
          const pages = [
            ['home','/'],
            ['case','/investigations/rci-tabung-haji/'],
            ['narrative','/investigations/rci-tabung-haji/narratives/'],
            ['money','/investigations/rci-tabung-haji/money/'],
            ['people','/investigations/rci-tabung-haji/people/'],
            ['news','/news/'],
            ['sources','/investigations/rci-tabung-haji/sources/']
          ];
          const browser = await chromium.launch();
          const report = [];

          async function check(viewName, viewport, targets) {
            const context = await browser.newContext({ viewportSize: viewport, deviceScaleFactor: 1 });
            for (const [name, path] of targets) {
              const page = await context.newPage();
              const url = `${base}${path}?signalqa=${Date.now()}-${Math.random()}`;
              await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForSelector('body.raven-signal', { timeout: 15000 });

              const metrics = await page.evaluate(() => ({
                title: document.title,
                bodyClass: document.body.className,
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
                signalCss: !!document.querySelector('link[data-raven-signal-v6]'),
                signalJs: !!document.querySelector('script[data-raven-signal-v6]'),
                homeHero: !!document.querySelector('.signal-home-hero'),
                lenses: document.querySelectorAll('.signal-lens').length,
                truthMap: document.querySelectorAll('.signal-map-node').length,
                narrativeCards: document.querySelectorAll('.signal-narrative-card').length,
                moneyClarifier: !!document.querySelector('.signal-money-clarifier'),
                processRail: !!document.querySelector('.signal-process-rail'),
                sourceKey: !!document.querySelector('.signal-source-key')
              }));

              if (!metrics.signalCss || !metrics.signalJs) throw new Error(`${name}: Signal assets missing`);
              if (metrics.scrollWidth > metrics.width + 4) throw new Error(`${name}: horizontal overflow ${metrics.scrollWidth} > ${metrics.width}`);
              if (name === 'home' && !metrics.homeHero) throw new Error('home: Signal hero missing');
              if (name === 'case' && (metrics.lenses !== 4 || metrics.truthMap !== 7)) throw new Error(`case: lenses/map mismatch ${metrics.lenses}/${metrics.truthMap}`);
              if (name === 'narrative' && metrics.narrativeCards < 8) throw new Error(`narrative: only ${metrics.narrativeCards} Signal cards rendered`);
              if (name === 'money' && !metrics.moneyClarifier) throw new Error('money: category clarifier missing');
              if (name === 'people' && !metrics.processRail) throw new Error('people: process rail missing');
              if (name === 'sources' && !metrics.sourceKey) throw new Error('sources: source key missing');

              await page.screenshot({ path: `visual-qa/${viewName}-${name}.png`, fullPage: true });
              report.push({ viewName, name, url, ...metrics });
              await page.close();
            }
            await context.close();
          }

          await check('mobile', { width: 390, height: 844 }, pages);
          await check('desktop', { width: 1440, height: 900 }, pages.filter(([n]) => ['home','case','narrative'].includes(n)));
          await browser.close();
          fs.writeFileSync('visual-qa/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          JS
          node /tmp/raven-visual-qa.mjs

      - name: Upload rendered QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: raven-signal-v6-visual-qa
          path: visual-qa/
          retention-days: 14

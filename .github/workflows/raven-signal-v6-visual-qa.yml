# Full rendered verification refreshed for Public Language V2.3 + Raven Reader V8
name: Raven Unified V7 Visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raven-signal-v6-visual-qa.yml'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'scripts/raven-v7-qa.mjs'
      - 'scripts/raven-reader-v8-qa.mjs'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Audit all public pages at mobile and desktop sizes
        run: |
          node scripts/raven-v7-qa.mjs

      - name: Audit CASEFILE progressive disclosure
        run: |
          node scripts/raven-reader-v8-qa.mjs

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raven-unified-v7-visual-qa
          path: visual-qa/
          retention-days: 14

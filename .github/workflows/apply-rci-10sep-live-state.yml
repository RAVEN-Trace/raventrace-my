name: Apply RCI 10 Sep live state

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_rci_10sep_live_state.py'
      - '.github/workflows/apply-rci-10sep-live-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        run: python -m pip install lxml Pillow
      - name: Apply verified 10 Sep state
        run: python scripts/apply_rci_10sep_live_state.py
      - name: Rebuild standalone RCI sections
        run: python scripts/build_rci_share_pages.py
      - name: QA verified state
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
            'investigations/rci-tabung-haji/index.html': ['10 Sep 2026', 'Azmi Ahmad didakwa', 'Reman Abdul Azeez', 'id="s58"', 'id="s59"'],
            'investigations/rci-tabung-haji/updates/index.html': ['10 Sep 2026', 'Azmi Ahmad didakwa', 'Reman Abdul Azeez'],
            'investigations/rci-tabung-haji/people/index.html': ['Datuk Azmi Ahmad', 'Didakwa · belum sabit'],
            'investigations/index.html': ['4 individu didakwa setakat 10 Sep', 'azmi-ahmad-didakwa'],
            'news/index.html': ['news-2026-09-10-azmi-charged', 'news-2026-09-10-azeez-remand'],
            'investigations/rci-tabung-haji/narratives/index.html': ['Setakat 10 September, empat individu telah didakwa'],
          }
          for rel, needles in checks.items():
            text = Path(rel).read_text()
            missing = [n for n in needles if n not in text]
            if missing:
              raise SystemExit(f'{rel}: missing {missing}')
          print('10 Sep RCI QA PASS')
          PY
      - name: Commit generated live-state pages
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investigations news assets/js/raven-section.js
          git commit -m 'Sync RCI live state through 10 Sep'
          git push

name: Apply RCI 11 Sep investigation update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_rci_11sep_investigation_update.py'
      - '.github/workflows/apply-rci-11sep-investigation-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified 11 Sep investigation update
        run: python scripts/apply_rci_11sep_investigation_update.py
      - name: QA evidence boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'news/2026/09/11/empat-atau-lima-didakwa-rekod-tidak-seragam/index.html':['Empat atau lima telah didakwa?','DISPUTED RECORD','Pertuduhan bukan sabitan','14 September','prosecution notice'],
            'news/index.html':['news-2026-09-11-count-discrepancy','11 Sep 2026 · 23:37 MYT'],
            'investigations/rci-tabung-haji/updates/index.html':['JEJAK / 11-01','empat lawan lima','14 Sep','AMLA','24 Sep'],
          }
          for rel,needles in checks.items():
            text=Path(rel).read_text()
            missing=[x for x in needles if x not in text]
            if missing: raise SystemExit(f'{rel}: missing {missing}')
          print('11 Sep investigation QA PASS')
          PY
      - name: Commit generated investigation pages
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news investigations/rci-tabung-haji/updates/index.html
          git commit -m 'Publish 11 Sep RCI forensic investigation update'
          git push

name: Raven Reader Funnel V1.2.1 Compatibility QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raven-funnel-v1-qa.yml'
      - 'assets/css/raven-funnel-v1.css'
      - 'assets/js/raven-funnel-v1.js'
      - 'assets/css/raven-reader-v13.css'
      - 'assets/js/raven-reader-v13.js'
      - 'scripts/apply_raven_funnel_v1.py'
      - 'investigations/rci-tabung-haji/narratives/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-funnel-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate source syntax
        run: |
          node --check assets/js/raven-funnel-v1.js
          node --check assets/js/raven-reader-v13.js
          python -m py_compile scripts/apply_raven_funnel_v1.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production funnel compatibility
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://raven-trace.github.io/raventrace-my';
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const browser=await chromium.launch();
            const errors=[]; const report={};
            const check=(c,m)=>{ if(!c) errors.push(m); };

            async function openCurrent(page,path){
              for(let i=0;i<36;i++){
                await page.goto(`${base}${path}?funnelcompat121=${Date.now()}-${Math.random()}`,{waitUntil:'domcontentloaded',timeout:45000});
                const ready=await page.evaluate(()=>
                  !!document.querySelector('link[href*="raven-funnel-v1.css?v=1.2.1"]') &&
                  !!document.querySelector('script[src*="raven-funnel-v1.js?v=1.2.1"]') &&
                  !!window.ravenReadMetrics
                );
                if(ready) return;
                await sleep(3000);
              }
              throw new Error(`Funnel V1.2.1 runtime not deployed: ${path}`);
            }

            for(const viewport of [{width:390,height:844,name:'mobile'},{width:1440,height:900,name:'desktop'}]){
              const ctx=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
              const page=await ctx.newPage();
              await openCurrent(page,'/investigations/rci-tabung-haji/narratives/');
              await page.waitForTimeout(350);

              const state=await page.evaluate((label)=>{
                const cards=[...document.querySelectorAll('.control-grid > article')];
                return {
                  viewport:label,
                  cards:cards.length,
                  statuses:document.querySelectorAll('.control-grid .status').length,
                  sectionLinks:document.querySelectorAll('.section-links a').length,
                  caseLinks:[...document.querySelectorAll('a')].filter(a=>a.getAttribute('href')==='/raventrace-my/investigations/rci-tabung-haji/').length,
                  sourceLinks:[...document.querySelectorAll('a')].filter(a=>a.getAttribute('href')==='/raventrace-my/investigations/rci-tabung-haji/sources/').length,
                  rm13:document.body.innerText.includes('RM13 bilion dicuri / hilang'),
                  forfeiture:document.body.innerText.includes('application ≠ final forfeiture order'),
                  disputed:document.body.innerText.includes('DISPUTED / UNKNOWN'),
                  css121:!!document.querySelector('link[href*="raven-funnel-v1.css?v=1.2.1"]'),
                  js121:!!document.querySelector('script[src*="raven-funnel-v1.js?v=1.2.1"]'),
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  api:!!window.ravenReadMetrics
                };
              },viewport.name);

              check(state.cards>=6,`${viewport.name}: narrative units ${state.cards}`);
              check(state.statuses>=6,`${viewport.name}: status labels ${state.statuses}`);
              check(state.sectionLinks>=6,`${viewport.name}: section navigation incomplete`);
              check(state.caseLinks>=1,`${viewport.name}: CASEFILE continuation missing`);
              check(state.sourceLinks>=1,`${viewport.name}: Source Room route missing`);
              check(state.rm13,`${viewport.name}: RM13b narrative unit missing`);
              check(state.forfeiture,`${viewport.name}: forfeiture category distinction missing`);
              check(state.disputed,`${viewport.name}: political-motive uncertainty missing`);
              check(state.css121 && state.js121,`${viewport.name}: V1.2.1 cache keys missing`);
              check(state.overflow<=4,`${viewport.name}: overflow ${state.overflow}`);
              check(state.api,`${viewport.name}: metrics API missing`);

              report[viewport.name]=state;
              await ctx.close();
            }

            await browser.close();
            console.log(JSON.stringify({report,errors},null,2));
            if(errors.length) throw new Error(errors.join('\n'));
          })();
          JS
      - name: Upload Funnel QA marker
        if: always()
        run: |
          mkdir -p funnel-qa
          printf '{"contract":"truth-navigation-compatibility","funnel":"1.2.1","reader":"1.3.1","status":"workflow completed"}\n' > funnel-qa/report.json
      - name: Upload Funnel QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raven-reader-funnel-v121-compatibility-qa
          path: funnel-qa/
          retention-days: 14

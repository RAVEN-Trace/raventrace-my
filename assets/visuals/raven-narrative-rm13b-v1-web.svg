<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Raven Narrative Forensics: RM13 bilion</title><desc id="desc">Claim, record, narrative gap and verdict for the claim RM13 billion was stolen.</desc>
<rect width="1200" height="675" fill="#11161c"/><rect x="42" y="40" width="1116" height="595" rx="4" fill="#f7f4ed"/>
<text x="78" y="78" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#0b5d6b">RAVEN · NARRATIVE FORENSICS</text>
<line x1="78" y1="96" x2="1122" y2="96" stroke="#b9b5ab"/>
<text x="78" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7a1f2b">01 · ORANG KATA</text>
<text x="78" y="196" font-family="Georgia,serif" font-size="51" font-weight="700" fill="#121418">“RM13 BILION DICURI.”</text>
<text x="78" y="228" font-family="Arial,sans-serif" font-size="17" fill="#4a545c">Claim popular perlu diuji terhadap kategori dan rekod sebenar.</text>
<rect x="78" y="260" width="640" height="164" rx="3" fill="#e5f0f2" stroke="#82a7b1"/>
<text x="106" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#0b5d6b">02 · APA REKOD TUNJUK</text>
<text x="106" y="354" font-family="Georgia,serif" font-size="43" font-weight="700" fill="#074955">RM10.2b</text>
<text x="106" y="382" font-family="Arial,sans-serif" font-size="16" fill="#244c5a">government / UJSB burden</text>
<line x1="395" y1="321" x2="395" y2="396" stroke="#82a7b1"/>
<text x="432" y="354" font-family="Georgia,serif" font-size="43" font-weight="700" fill="#074955">RM2.6b</text>
<text x="432" y="382" font-family="Arial,sans-serif" font-size="16" fill="#244c5a">TH impairments</text>
<rect x="742" y="260" width="380" height="164" rx="3" fill="#fff2d9" stroke="#c59350"/>
<text x="770" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#a04a00">03 · NARRATIVE GAP</text>
<text x="770" y="354" font-family="Georgia,serif" font-size="45" font-weight="700" fill="#6b3100">LOSS ≠ THEFT</text>
<text x="770" y="384" font-family="Arial,sans-serif" font-size="15" fill="#3f474d">Kerugian tidak dengan sendiri membuktikan</text>
<text x="770" y="406" font-family="Arial,sans-serif" font-size="15" fill="#3f474d">beneficiary, mechanism atau criminal intent.</text>
<rect x="78" y="458" width="1044" height="116" rx="3" fill="#0b5d6b"/>
<text x="106" y="492" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#bff5ff">04 · RAVEN VERDICT</text>
<text x="106" y="535" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#ffffff">Gunakan: “kerugian / beban hampir RM13b”.</text>
<text x="106" y="562" font-family="Arial,sans-serif" font-size="16" fill="#ddefF2">Angka kerugian bukan bukti automatik bahawa keseluruhan RM13b dicuri.</text>
<text x="78" y="610" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6b7379">EDITORIAL EXPLAINER · BUKAN DOKUMEN ATAU BUKTI ASAL · RAVEN-TRACE</text>

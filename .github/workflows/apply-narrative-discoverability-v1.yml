name: Apply Narrative Discoverability V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ensure_narrative_links_sitewide.py'
      - '.github/workflows/apply-narrative-discoverability-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add narrative links across public pages
        run: python scripts/ensure_narrative_links_sitewide.py
      - name: Validate diff
        run: git diff --check
      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about corrections investigations methodology news tips
          git commit -m 'ux: make Narrative Forensics discoverable from every public page'
          git push

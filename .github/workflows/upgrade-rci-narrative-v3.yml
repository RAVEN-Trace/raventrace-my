name: Upgrade RCI narrative audit V3
on:
  push:
    paths:
      - 'scripts/upgrade_rci_narrative_v3.py'
      - '.github/workflows/upgrade-rci-narrative-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrative V3
        run: python scripts/upgrade_rci_narrative_v3.py
      - name: QA narrative page
        run: |
          grep -q 'Lapan naratif utama' investigations/rci-tabung-haji/narratives/index.html
          grep -q 'Apa yang boleh mengubah verdict?' investigations/rci-tabung-haji/narratives/index.html
          grep -q 'RM12 bilion hilang / disakau' investigations/rci-tabung-haji/narratives/index.html
          grep -q 'Tiada bukti kecurian, jadi tiada salah laku' investigations/rci-tabung-haji/narratives/index.html
          grep -q '11 Sep 2026 · 01:15 MYT' investigations/rci-tabung-haji/narratives/index.html
      - name: Commit narrative V3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investigations/rci-tabung-haji/narratives/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade RCI narrative audit to V3 evidence-change model'
          git push

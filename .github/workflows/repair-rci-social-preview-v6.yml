name: Repair RCI social preview v6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_rci_social_preview_v6.py'
      - '.github/workflows/repair-rci-social-preview-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate valid 1200x630 JPEG and update references
        run: python scripts/repair_rci_social_preview_v6.py
      - name: Verify image integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('assets/og/rci-tabung-haji-share-v6.jpg')
          with Image.open(p) as im:
              im.load()
              assert im.format == 'JPEG'
              assert im.size == (1200,630)
          assert p.stat().st_size > 50000
          print('OG v6 PASS', p.stat().st_size)
          PY
          grep -R "rci-tabung-haji-share-v5.jpg" -n investigations news scripts assets/js || true
          if grep -R "rci-tabung-haji-share-v5.jpg" -n investigations news scripts assets/js; then
            echo 'Stale v5 references remain' >&2
            exit 1
          fi
      - name: Commit repaired social preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/og scripts investigations news assets/js
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Repair RCI social preview with valid v6 JPEG'
          git push

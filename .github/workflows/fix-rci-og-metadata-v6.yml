name: Fix RCI OG metadata v6

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_rci_og_metadata_v6.py'
      - '.github/workflows/fix-rci-og-metadata-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v6 metadata consistency fix
        run: python scripts/fix_rci_og_metadata_v6.py
      - name: Commit corrected metadata
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investigations/rci-tabung-haji
          git commit -m 'Fix RCI social preview metadata and stale update queue'
          git push

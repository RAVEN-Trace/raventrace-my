<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Raven money decomposition: hampir RM13 bilion</title><desc id="desc">Official loss and burden figure broken into RM10.2 billion government UJSB burden and RM2.6 billion TH impairments.</desc>
<rect width="1200" height="675" fill="#11161c"/><rect x="42" y="40" width="1116" height="595" rx="4" fill="#fffdf8"/>
<text x="78" y="78" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#0b5d6b">RAVEN · FOLLOW THE MONEY</text><line x1="78" y1="96" x2="1122" y2="96" stroke="#b9b5ab"/>
<text x="78" y="148" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#121418">Hampir RM13 bilion</text>
<text x="78" y="178" font-family="Arial,sans-serif" font-size="18" fill="#4a545c">kerugian / beban rasmi dalam rangka 14 pelaburan bermasalah</text>
<rect x="78" y="224" width="760" height="80" rx="3" fill="#0b5d6b"/><rect x="838" y="224" width="194" height="80" rx="3" fill="#82a7b1"/>
<text x="104" y="274" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#fff">RM10.2b</text><text x="855" y="274" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#071116">RM2.6b</text>
<text x="78" y="336" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0b5d6b">GOVERNMENT / UJSB BURDEN</text><text x="78" y="360" font-family="Arial,sans-serif" font-size="15" fill="#4a545c">Rescue / restructuring burden reported by MOF.</text>
<text x="612" y="336" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#0b5d6b">TH IMPAIRMENTS</text><text x="612" y="360" font-family="Arial,sans-serif" font-size="15" fill="#4a545c">Write-downs borne by TH for assets still managed.</text>
<rect x="78" y="404" width="1044" height="128" rx="3" fill="#fff2d9" stroke="#c59350"/>
<text x="106" y="438" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#a04a00">BUKAN AUTOMATIK</text>
<text x="106" y="482" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#6b3100">✕ RM13b dicuri</text><text x="404" y="482" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#6b3100">✕ RM13b masuk poket seseorang</text>
<text x="106" y="514" font-family="Arial,sans-serif" font-size="15" fill="#3f474d">Loss / burden, impairment dan criminal liability ialah kategori berbeza.</text>
<text x="78" y="575" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#121418">LOSS ≠ THEFT</text>
<text x="334" y="575" font-family="Arial,sans-serif" font-size="16" fill="#4a545c">Jenayah memerlukan bukti transaction-specific dan elemen undang-undang.</text>
<text x="78" y="610" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6b7379">EDITORIAL EXPLAINER · BUKAN DOKUMEN ATAU BUKTI ASAL · RAVEN-TRACE</text>
</svg>
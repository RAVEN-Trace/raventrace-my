# Live production gate for factual/legal state + public-language presentation
name: Production Integrity Live Render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-integrity-live-render.yml'
      - 'index.html'
      - 'about/**'
      - 'methodology/**'
      - 'investigations/**'
      - 'news/**'
      - 'assets/js/**'
      - 'assets/css/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://raven-trace.github.io/raventrace-my
    steps:
      - name: Wait for complete 13 Sep evidence payload
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['BASE']
          headers={'User-Agent':'RAVEN-Trace-Live-QA/13SepVerification','Cache-Control':'no-cache'}
          checks={
            '/':['empat individu telah berdepan pertuduhan','SPRM pula menyebut lima','raven-v5.css?v=5.0.0','raven-unified-v7.css?v=7.0.5'],
            '/news/':['SEMAKAN TERBARU','REKOD TAK SEPADAN'],
            '/investigations/rci-tabung-haji/':['Cut-off · 13 Sep 2026','13 Sep evidence revision','Empat vs lima telah didakwa','19 Jul 2022','RM18m/RM18.6m'],
            '/investigations/rci-tabung-haji/updates/':['RCI TABUNG HAJI · PERKEMBANGAN KES','13 Sep evidence revision','Empat court-confirmed; SPRM pernah menyebut lima','RM18m/RM18.6m'],
            '/investigations/rci-tabung-haji/people/':['Empat telah berdepan pertuduhan','Belum didakwa · 24 Sep','4 court-confirmed / 5 agency-stated'],
            '/investigations/rci-tabung-haji/timeline/':['19 Jul 2022','Reman lima hari','Reman dilanjutkan dua hari'],
            '/investigations/rci-tabung-haji/money/':['RM10.2b','RM2.6b','Bukan mens rea'],
            '/investigations/rci-tabung-haji/narratives/':['RM13 bilion dicuri / hilang','application ≠ final forfeiture order','DISPUTED / UNKNOWN','Like, repost dan screenshot bukan proof of truth'],
            '/investigations/rci-tabung-haji/narratives/political-social-media/':['AUDIT NARATIF POLITIK + MEDIA SOSIAL','Petunjuk media sosial','Siapa bawa cerita apa?'],
            '/investigations/rci-tabung-haji/sources/':['Evidence ledger','Parlimen · jawapan bertulis 22 Mei 2023','2022 withdrawal','Social-media limitation'],
            '/about/':['Cari yang benar.','Pecahkan cerita.','Cara kerja RAVEN-Trace','Kebebasan editorial + penggunaan AI'],
            '/methodology/':['Cara Raven bekerja','A · Sumber asal / bukti langsung','metadata','Cari sumber asal'],
          }
          for attempt in range(60):
              ok=True
              for path,tokens in checks.items():
                  try:
                      req=urllib.request.Request(base+path+'?liveqa='+str(time.time_ns()),headers=headers)
                      text=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','replace')
                      if not all(x in text for x in tokens): ok=False
                  except Exception as e:
                      ok=False; print('wait',attempt,path,type(e).__name__,str(e)[:120])
              if ok:
                  print('13 SEP VERIFIED PAYLOAD READY')
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('Timed out waiting for 13 Sep verified Pages payload')
          PY

      - name: Verify legal and factual boundary
        run: |
          python - <<'PY'
          import os,urllib.request,time
          base=os.environ['BASE']; h={'User-Agent':'RAVEN-Trace-Live-QA/13SepVerification','Cache-Control':'no-cache'}
          checks={
            '/':['empat individu telah berdepan pertuduhan','SPRM pula menyebut lima'],
            '/investigations/rci-tabung-haji/':['RCI finding ≠ sabitan','Pertuduhan ≠ bersalah','Kerugian ≠ kecurian'],
            '/investigations/rci-tabung-haji/people/':['Pertuduhan bukan sabitan','Reman bukan pertuduhan'],
            '/investigations/rci-tabung-haji/money/':['Kerugian besar tidak dengan sendiri membuktikan kecurian','Bukan automatic theft finding'],
            '/investigations/rci-tabung-haji/narratives/':['loss ≠ theft','application ≠ final forfeiture order','timing politik tidak membuktikan political direction'],
          }
          for path,tokens in checks.items():
              req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers=h)
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in tokens: assert x in text, f'{path}: missing {x}'
          forbidden=['5 individu telah didakwa','Azeez mengambil RM193.5 juta','RM18.6 juta telah dilucuthakkan','SPRM dikawal politik','Jamil Khir telah didakwa']
          for path in checks:
              req=urllib.request.Request(base+path+'?qa2='+str(time.time_ns()),headers=h)
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in forbidden: assert x not in text, f'{path}: overclaim {x}'
          print('LEGAL/FACTUAL BOUNDARY: PASS')
          PY

      - name: Verify public-language residue is absent
        run: |
          python - <<'PY'
          import os,time,urllib.request
          base=os.environ['BASE']; h={'User-Agent':'RAVEN-Trace-Live-QA/13SepVerification','Cache-Control':'no-cache'}
          paths=['/','/news/','/about/','/methodology/','/investigations/rci-tabung-haji/updates/','/investigations/rci-tabung-haji/narratives/','/investigations/rci-tabung-haji/narratives/political-social-media/']
          stale=['Category collapse + number laundering','ANALISIS / INFERENCE · MOTIF TIDAK DIBUKTIKAN','comparative selective-enforcement analysis','counter-narrative','signal yang diperhatikan','pemberat engagement','DISPUTED RECORD','Chronology mahkamah','dokumen primer penuh','frame yang paling sedap didengar','metodologi sampel','pelaporan beratribusi','Generalisasi sentimen platform','Peta aktor','sintesis politik','menetapkan motif agensi','RAVEN-Trace Protocol','Independence & AI-assisted disclosure','DIPERTIKAIKAN · REKOD','Apa perlu ditahan?']
          for path in paths:
              req=urllib.request.Request(base+path+'?qa='+str(time.time_ns()),headers=h)
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in stale: assert x not in text, f'{path}: stale public phrase {x}'
          print('PUBLIC LANGUAGE RESIDUE: PASS')
          PY

      - name: Verify factual runtime assets remain inert
        run: |
          python - <<'PY'
          import os,urllib.request,time
          base=os.environ['BASE']
          assets=['/assets/js/raven-evidence-ux.js?v=3.0.0','/assets/js/raven-publication-core.js?v=3.0.0','/assets/js/raven-narrative.js?v=2.0.0']
          forbidden=['Jamil Khir','Abdul Azeez','Azmi Ahmad','9 September 2026','18:29 MYT','ravenCaseState','.section-cutoff']
          for path in assets:
              req=urllib.request.Request(base+path+'&qa='+str(time.time_ns()),headers={'User-Agent':'RAVEN-Trace-Live-QA/13SepVerification','Cache-Control':'no-cache'})
              text=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
              for x in forbidden: assert x not in text, f'{path}: factual mutator token present: {x}'
          print('RUNTIME INERT: PASS')
          PY

name: Fix RCI OG v3

on:
  push:
    paths:
      - '.github/workflows/fix-rci-og-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair main CASEFILE OG metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('investigations/rci-tabung-haji/index.html')
          s = p.read_text()
          s = s.replace('https://raven-trace.github.io/raventrace-my/assets/og/rci-tabung-haji-updates-v2.jpg?v=20260909d', 'https://raven-trace.github.io/raventrace-my/assets/og/rci-tabung-haji-updates-v3.jpg')
          s = s.replace('<meta property="og:image:width" content="1200">', '<meta property="og:image:width" content="600">')
          s = s.replace('<meta property="og:image:height" content="630">', '<meta property="og:image:height" content="315">')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investigations/rci-tabung-haji/index.html
          git commit -m 'Point RCI CASEFILE preview to verified image asset'
          git push

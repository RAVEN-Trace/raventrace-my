<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><rect width="1200" height="675" fill="#11161c"/><rect x="42" y="40" width="1116" height="595" rx="4" fill="#fffdf8"/><text x="78" y="78" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#0b5d6b">RAVEN · CHECK THE RECORD</text><line x1="78" y1="96" x2="1122" y2="96" stroke="#b9b5ab"/><text x="78" y="148" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#121418">Empat vs lima</text><text x="78" y="178" font-family="Arial,sans-serif" font-size="18" fill="#4a545c">Dua rekod awam tidak sepadan. Paparkan kedua-duanya.</text><rect x="78" y="218" width="454" height="220" rx="3" fill="#e5f0f2" stroke="#82a7b1"/><text x="106" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#0b5d6b">REKOD MAHKAMAH</text><text x="106" y="337" font-family="Georgia,serif" font-size="82" font-weight="700" fill="#074955">04</text><text x="240" y="300" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#244c5a">charge-readings</text><text x="240" y="329" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#244c5a">disahkan melalui rekod</text><text x="580" y="340" font-family="Georgia,serif" font-size="68" font-weight="700" text-anchor="middle" fill="#7a1f2b">≠</text><rect x="668" y="218" width="454" height="220" rx="3" fill="#fff2d9" stroke="#c59350"/><text x="696" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#a04a00">KENYATAAN AGENSI</text><text x="696" y="337" font-family="Georgia,serif" font-size="82" font-weight="700" fill="#6b3100">05</text><text x="830" y="300" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6b3100">agency-stated count</text><text x="830" y="329" font-family="Arial,sans-serif" font-size="16" fill="#3f474d">dalam kenyataan awam</text><rect x="78" y="470" width="1044" height="104" rx="3" fill="#f5e9eb" stroke="#b36872"/><text x="106" y="502" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7a1f2b">NARRATIVE GAP</text><text x="106" y="536" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#121418">Agency-stated count ≠ charge yang telah dibacakan di mahkamah.</text><text x="106" y="562" font-family="Arial,sans-serif" font-size="15" fill="#4a545c">Status diterangkan dalam rekod kes dan dikemas kini apabila prosiding berubah.</text><text x="78" y="610" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6b7379">EDITORIAL EXPLAINER · DUA REKOD DIPAPARKAN SERENTAK · RAVEN-TRACE</text></svg>